<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library & PDF Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- MODERN CSS STYLING --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --glass-white: rgba(255, 255, 255, 0.85);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-dark);
            padding-bottom: 60px;
        }

        /* Top Header */
        header {
            text-align: center;
            padding: 40px 20px 20px 20px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e1b4b;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-light);
            font-size: 1rem;
        }

        /* Main App Container */
        .app-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
        }

        /* ==========================================
           MAIN FEATURE: ADVANCED UPLOAD SECTION 
           ========================================== */
        .upload-section {
            background: var(--glass-white);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #1e1b4b;
        }

        .section-title i {
            color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
            padding: 10px;
            border-radius: 12px;
        }

        /* Form Layout Grid */
        .upload-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .upload-grid { grid-template-columns: 1fr; }
        }

        /* Meta Inputs Left Side */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.5);
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        /* Modern PDF Drop Zone Right Side */
        .drop-zone {
            border: 2.5px dashed #cbd5e1;
            border-radius: 18px;
            background: rgba(248, 250, 252, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.03);
        }

        .drop-zone i.cloud-icon {
            font-size: 3.5rem;
            color: var(--primary);
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .drop-zone:hover i.cloud-icon {
            transform: translateY(-5px);
        }

        .drop-zone p {
            font-size: 0.95rem;
            color: var(--text-dark);
            font-weight: 600;
        }

        .drop-zone span {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 5px;
        }

        /* File Selected State Overlay */
        .file-selected-status {
            display: none;
            margin-top: 15px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            padding: 10px 16px;
            border-radius: 12px;
            align-items: center;
            gap: 10px;
            color: #065f46;
            font-size: 0.85rem;
            font-weight: 500;
            width: 100%;
            word-break: break-all;
        }

        .file-selected-status i {
            color: var(--success);
            font-size: 1.1rem;
        }

        .file-input { display: none; }

        /* Fancy Submit Button */
        .submit-btn-wrapper {
            grid-column: 1 / -1;
            text-align: right;
            margin-top: 10px;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.35);
        }

        /* ==========================================
           BOOK SHELF DISPLAY SECTION
           ========================================== */
        .shelf-section {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        /* Modern Book Card Design */
        .book-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .book-thumbnail {
            height: 180px;
            background: linear-gradient(135deg, #e0e7ff 0%, #e0f2fe 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .book-thumbnail i.pdf-icon {
            font-size: 4rem;
            color: #ef4444;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .book-details {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .b-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .b-author {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 20px;
            font-weight: 500;
        }

        .b-action {
            margin-top: auto;
            background: #f8fafc;
            color: var(--primary);
            text-decoration: none;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid #e2e8f0;
        }

        .b-action:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fas fa-bookmark" style="color: var(--primary);"></i> Knowledge Hub</h1>
        <p>သင်၏ PDF စာအုပ်ကောင်းများကို စနစ်တကျ သိမ်းဆည်းပြီး ဖတ်ရှုလိုက်ပါ။</p>
    </header>

    <div class="app-container">
        
        <div class="upload-section">
            <div class="section-title">
                <i class="fas fa-file-upload"></i>
                <h2>စာအုပ်အသစ်တင်ရန် (Add New PDF Book)</h2>
            </div>

            <form id="pdfUploadForm">
                <div class="upload-grid">
                    
                    <div class="form-inputs">
                        <div class="input-group">
                            <label for="titleInput">စာအုပ်အမည် / Book Title</label>
                            <input type="text" id="titleInput" placeholder="ဥပမာ - မန္တလေးကျောင်းသားတစ်ယောက်ရဲ့ ဒိုင်ယာရီ" required>
                        </div>
                        <div class="input-group">
                            <label for="authorInput">စာရေးဆရာ / Author Name</label>
                            <input type="text" id="authorInput" placeholder="ဥပမာ - ဆရာကြီးပီမိုးနင်း" required>
                        </div>
                    </div>

                    <div class="form-dropzone">
                        <label style="display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px;">PDF File ရွေးချယ်ရန်</label>
                        
                        <div class="drop-zone" id="dropZoneContainer">
                            <i class="fas fa-cloud-arrow-up cloud-icon"></i>
                            <p>ဤနေရာတွင် နှိပ်၍ ဖိုင်ရွေးပါ</p>
                            <span>သို့မဟုတ် PDF ဖိုင်ကို ဆွဲထည့်ပါ (Drag & Drop)</span>
                            <input type="file" id="fileInput" class="file-input" accept=".pdf" required>
                            
                            <div class="file-selected-status" id="fileStatusBox">
                                <i class="fas fa-check-circle"></i>
                                <span id="fileNameDisplay">Selected: filename.pdf</span>
                            </div>
                        </div>
                    </div>

                    <div class="submit-btn-wrapper">
                        <button type="submit" class="btn-submit">
                            <i class="fas fa-plus"></i> စာအုပ်စင်ထဲသို့ ထည့်မည်
                        </button>
                    </div>

                </div>
            </form>
        </div>

        <div class="shelf-section">
            <div class="section-title">
                <i class="fas fa-book-open"></i>
                <h2>လက်ရှိစာအုပ်စင် (Book Shelf)</h2>
            </div>
            
            <div class="books-grid" id="booksGrid">
                <div class="book-card">
                    <div class="book-thumbnail">
                        <i class="fas fa-file-pdf pdf-icon"></i>
                    </div>
                    <div class="book-details">
                        <div class="b-title">သုတေသနစာတမ်း နမူနာ</div>
                        <div class="b-author">ဒေါက်တာအောင်ကျော်</div>
                        <a href="#" class="b-action" onclick="alert('ဒါက နမူနာ စာအုပ်ဖြစ်လို့ ဖတ်ရှုလို့မရသေးပါဘူးဗျာ။ စာအုပ်အသစ် တင်ကြည့်ပေးပါ။'); return false;">
                            <i class="fas fa-eye"></i> ဖတ်ရှုရန်
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const dropZone = document.getElementById('dropZoneContainer');
        const fileInput = document.getElementById('fileInput');
        const fileStatusBox = document.getElementById('fileStatusBox');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const uploadForm = document.getElementById('pdfUploadForm');
        const booksGrid = document.getElementById('booksGrid');

        // Dropzone ကို နှိပ်ရင် ဖိုင်ရွေးတဲ့ Window ပွင့်အောင်လုပ်ခြင်း
        dropZone.addEventListener('click', (e) => {
            // Status Box ကို နှိပ်မိရင်လည်း အလုပ်လုပ်အောင် တားဆီးမှု မလုပ်ပါ
            fileInput.click();
        });

        // Drag & Drop လုပ်တဲ့အခါ visual effects ပြောင်းလဲခြင်း
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            
            if (e.dataTransfer.files.length > 0) {
                const droppedFiles = e.dataTransfer.files;
                if(droppedFiles[0].type === "application/pdf") {
                    fileInput.files = droppedFiles;
                    handleFileSelection(droppedFiles[0].name);
                } else {
                    alert("ကျေးဇူးပြု၍ PDF ဖိုင်အမျိုးအစားကိုသာ တင်ပေးပါခင်ဗျာ။");
                }
            }
        });

        // ရိုးရိုးနှိပ်ပြီး ဖိုင်ရွေးချယ်တဲ့အခါ
        fileInput.addEventListener('change', function() {
            if(this.files && this.files.length > 0) {
                handleFileSelection(this.files[0].name);
            }
        });

        // ဖိုင်ရွေးပြီးကြောင်း UI မှာ ပြောင်းလဲပေးတဲ့ Function
        function handleFileSelection(fileName) {
            fileStatusBox.style.display = 'flex';
            fileNameDisplay.textContent = "ရွေးချယ်ပြီး - " + fileName;
        }

        // စာအုပ်တင်ပြီး စာအုပ်စင်ထဲ ထည့်သွင်းခြင်း
        uploadForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const title = document.getElementById('titleInput').value;
            const author = document.getElementById('authorInput').value;
            const file = fileInput.files[0];

            if(file) {
                // PDF ဖိုင်ကို ယာယီ ဖတ်လို့ရမယ့် URL Link အဖြစ်ပြောင်းလဲခြင်း
                const fileURL = URL.createObjectURL(file);

                // Book Card အသစ်တည်ဆောက်ခြင်း
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-thumbnail">
                        <i class="fas fa-file-pdf pdf-icon"></i>
                    </div>
                    <div class="book-details">
                        <div class="b-title">${title}</div>
                        <div class="b-author">${author}</div>
                        <a href="${fileURL}" class="b-action" target="_blank">
                            <i class="fas fa-eye"></i> ဖတ်ရှုရန်
                        </a>
                    </div>
                `;

                // စာအုပ်စင်ရဲ့ အရှေ့ဆုံးကနေ ထည့်ပေးခြင်း (အသစ်တင်တာ ပထမဆုံးပေါ်အောင်)
                booksGrid.insertBefore(card, booksGrid.firstChild);

                // Form ကို မူလအတိုင်း ပြန်ရှင်းလင်းခြင်း
                uploadForm.reset();
                fileStatusBox.style.display = 'none';
            }
        });
    </script>
</body>
</html>
